name: Build Linuxium ISO

# This file must live at:  .github/workflows/build-iso.yml
#
# Changes from the original workflow:
#   * The job no longer runs *inside* a container. A live-build run needs
#     way more free disk than a default GitHub runner has, and you cannot
#     free host disk space from inside a container job. Instead we free
#     space on the host runner first, then run the exact same Debian 12
#     container with `docker run --privileged`.
#   * The full build log is saved and uploaded even when the build fails,
#     so you can actually see what live-build complained about.
#   * The ISO artifact is uploaded without re-compression (an ISO is
#     already compressed; compression-level 0 avoids a long, pointless
#     zip pass), together with its .sha256 file.
#   * Pushing a tag like v1.1 also publishes a GitHub Release. GitHub
#     rejects individual release assets of 2 GiB or more, so a full-size
#     ISO is split into verified 1900 MiB parts for that step.
#   * timeout-minutes + concurrency stop a stuck build from burning
#     6 hours of runner time.

# Deliberately manual (Actions tab -> "Build Linuxium ISO" -> Run workflow)
# plus version tags, so a one-line commit never starts an hour-long ISO
# build by surprise. If you would rather build on every push to main, add:
#     push:
#       branches: [main]
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed for the tag -> Release step at the bottom

concurrency:
  group: linuxium-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free up disk space (a full live build needs it)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune -af || true
          df -h /

      - name: Build ISO in a Debian 12 container
        run: |
          set -o pipefail
          chmod +x build-linuxium.sh
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/work" -w /work \
            debian:bookworm \
            bash -euxo pipefail -c "./build-linuxium.sh ./wallpaper.png ./lynx.png ./grub-bg.png" \
            2>&1 | tee build.log

      - name: Fix file ownership after the root container build
        if: always()
        run: sudo chown -R "$USER:$USER" linuxium-build wallpapers-extra-downloads 2>/dev/null || true

      - name: Show the ISO and verify its checksum
        run: |
          set -euo pipefail
          ls -lh linuxium-build/*.iso*
          (
            cd linuxium-build
            sha256sum -c ./*.iso.sha256
            sha256sum -c ./*.iso.xz.sha256
          )
          shopt -s nullglob
          isos=(linuxium-build/*.iso)
          xzs=(linuxium-build/*.iso.xz)
          if [ "${#isos[@]}" -eq 1 ] && [ "${#xzs[@]}" -eq 1 ]; then
            iso_bytes="$(stat -c %s "${isos[0]}")"
            xz_bytes="$(stat -c %s "${xzs[0]}")"
            iso_mib="$(awk -v b="$iso_bytes" 'BEGIN { printf "%.1f MiB", b / 1048576 }')"
            xz_mib="$(awk -v b="$xz_bytes" 'BEGIN { printf "%.1f MiB", b / 1048576 }')"
            saved="$(awk -v raw="$iso_bytes" -v cmp="$xz_bytes" 'BEGIN { if (raw > 0) printf "%.1f%%", (1 - cmp / raw) * 100; else print "0.0%" }')"
            {
              echo "### Linuxium Build Size Summary"
              echo ""
              echo "| Artifact | File | Size |"
              echo "| --- | --- | --- |"
              echo "| Bootable ISO (\`linuxium-iso\`) | \`$(basename "${isos[0]}")\` | ${iso_mib} |"
              echo "| Compressed ISO (\`linuxium-iso-compressed\`) | \`$(basename "${xzs[0]}")\` | **${xz_mib}** (${saved} smaller) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: linuxium-iso
          path: |
            linuxium-build/*.iso
            linuxium-build/*.iso.sha256
          compression-level: 9
          if-no-files-found: error
          retention-days: 14

      - name: Upload compressed ISO (.iso.xz)
        uses: actions/upload-artifact@v7
        with:
          name: linuxium-iso-compressed
          path: |
            linuxium-build/*.iso.xz
            linuxium-build/*.iso.xz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linuxium-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare Release assets (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp linuxium-build/*.iso.sha256 release-assets/
          cp linuxium-build/*.iso.xz.sha256 release-assets/
          # The artifacts above are already uploaded; free any remaining build
          # trees before copying/splitting so this step cannot run the runner dry.
          sudo rm -rf linuxium-build/chroot linuxium-build/cache linuxium-build/binary
          limit=$((1900 * 1024 * 1024))
          for xz_iso in linuxium-build/*.iso.xz; do
            xz_size="$(stat -c %s "$xz_iso")"
            if [ "$xz_size" -le "$limit" ]; then
              cp "$xz_iso" release-assets/
            fi
          done
          for iso in linuxium-build/*.iso; do
            base="$(basename "$iso")"
            size="$(stat -c %s "$iso")"
            if [ "$size" -le "$limit" ]; then
              cp "$iso" release-assets/
            else
              split -b 1900M -d -a 3 "$iso" "release-assets/${base}.part-"
              expected="$(awk 'NR == 1 { print $1 }' "release-assets/${base}.sha256")"
              actual="$(cat release-assets/"${base}".part-* | sha256sum | awk '{ print $1 }')"
              if [ "$actual" != "$expected" ]; then
                echo "ERROR: joining the split parts does not reproduce the ISO checksum" >&2
                exit 1
              fi
              echo "Split parts verified against ${base}.sha256"
              # Windows COPY does not guarantee wildcard ordering, so write
              # out every part in sequence instead of trusting name sorting.
              windows_join="copy /b"
              first_part=true
              for part in release-assets/"${base}".part-*; do
                if [ "$first_part" = true ]; then
                  windows_join="${windows_join} $(basename "$part")"
                  first_part=false
                else
                  windows_join="${windows_join} + $(basename "$part")"
                fi
              done
              windows_join="${windows_join} ${base}"
              {
                echo "This ISO was split because GitHub Release assets must be under 2 GiB."
                echo
                echo "Download every ${base}.part-* file and the .sha256 file, then join them:"
                echo "  Linux/macOS: cat ${base}.part-* > ${base}"
                echo "  Windows CMD: ${windows_join}"
                echo
                echo "Verify the joined ISO with the supplied SHA-256 file before writing it to USB."
              } > release-assets/HOW-TO-JOIN-THE-ISO.txt
            fi
          done
          ls -lh release-assets

      - name: Publish a Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
