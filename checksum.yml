name: Linuxium SHA256

on:
  # Runs by itself after a successful "Build Linuxium ISO" run
  workflow_run:
    workflows: ["Build Linuxium ISO"]
    types: [completed]
  # Or run it by hand with the ID of a build run (the number in the run's URL)
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the Build Linuxium ISO run to checksum"
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  checksum:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the ISO from the build run
        uses: actions/download-artifact@v4
        with:
          name: linuxium-iso
          path: iso
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create SHA256SUMS
        run: |
          cd iso
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS
          {
            echo "### Linuxium SHA256"
            echo ""
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: linuxium-sha256
          path: iso/SHA256SUMS
          retention-days: 30
